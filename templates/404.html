{% extends 'coaching/base.html' %}
{% load static %}

{% block title %}404 Page Not Found - Campus-Connect{% endblock %}

{% block content %}
<style>
    .error-container {
        min-height: 70vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
    }
    .error-card {
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(6, 182, 212, 0.3);
        border-radius: 24px;
        padding: 48px 36px;
        max-width: 540px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(6, 182, 212, 0.15);
        position: relative;
        overflow: hidden;
    }
    .error-card::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle, rgba(6, 182, 212, 0.1) 0%, transparent 60%);
        animation: pulseGlow 4s infinite ease-in-out;
        pointer-events: none;
    }
    @keyframes pulseGlow {
        0%, 100% { transform: scale(0.9); opacity: 0.5; }
        50% { transform: scale(1.1); opacity: 0.9; }
    }
    .radar-icon-wrapper {
        width: 110px;
        height: 110px;
        margin: 0 auto 24px auto;
        background: radial-gradient(circle, rgba(6, 182, 212, 0.2), rgba(15, 23, 42, 0.8));
        border: 2px solid rgba(6, 182, 212, 0.5);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3rem;
        color: #06b6d4;
        box-shadow: 0 0 25px rgba(6, 182, 212, 0.4);
        animation: floatRadar 3s ease-in-out infinite;
    }
    @keyframes floatRadar {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(10deg); }
    }
    .error-code {
        font-size: 4.5rem;
        font-weight: 900;
        letter-spacing: 2px;
        background: linear-gradient(135deg, #06b6d4, #3b82f6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 8px;
        line-height: 1;
    }
    .error-title {
        color: #ffffff;
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 12px;
    }
    .error-desc {
        color: #94a3b8;
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 28px;
    }
    .btn-actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
    }
    .btn-action-primary {
        background: linear-gradient(135deg, #06b6d4, #0891b2);
        color: #ffffff;
        padding: 12px 24px;
        border-radius: 12px;
        font-weight: 600;
        text-decoration: none;
        box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
        transition: all 0.3s ease;
    }
    .btn-action-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(6, 182, 212, 0.5);
        color: #ffffff;
    }
    .btn-action-secondary {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #cbd5e1;
        padding: 12px 24px;
        border-radius: 12px;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.3s ease;
    }
    .btn-action-secondary:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff;
    }
</style>

<div class="error-container">
    <div class="error-card">
        <div class="radar-icon-wrapper">
            <i class="fa-solid fa-compass-drafting"></i>
        </div>
        <div class="error-code">404</div>
        <h2 class="error-title">Page / Resource Not Found</h2>
        <p class="error-desc">
            The page or student record you requested does not exist or may have been moved.
        </p>
        <div class="btn-actions">
            <a href="{% url 'login' %}" class="btn-action-primary">
                <i class="fa-solid fa-house" style="margin-right: 6px;"></i> Return Home
            </a>
            <button onclick="window.history.back()" class="btn-action-secondary">
                <i class="fa-solid fa-arrow-left" style="margin-right: 6px;"></i> Go Back
            </button>
        </div>
    </div>
</div>
{% endblock %}
