<!-- SchoolAiVoice Single-Button Voice Agent Widget with Role Identification -->
<style>
    .school-ai-floating-btn {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 9990;
        background: linear-gradient(135deg, #6366f1, #8b5cf6, #d946ef);
        background-size: 200% 200%;
        animation: pulseGlow 4s infinite alternate;
        color: #ffffff;
        border: none;
        border-radius: 50px;
        padding: 14px 22px;
        font-weight: 600;
        font-size: 0.95rem;
        box-shadow: 0 10px 25px rgba(139, 92, 246, 0.45);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .school-ai-floating-btn:hover {
        transform: translateY(-3px) scale(1.03);
        box-shadow: 0 14px 30px rgba(139, 92, 246, 0.6);
    }
    @keyframes pulseGlow {
        0% { background-position: 0% 50%; }
        100% { background-position: 100% 50%; }
    }

    .school-ai-modal {
        display: none;
        position: fixed;
        bottom: 90px;
        right: 24px;
        width: 390px;
        max-width: calc(100vw - 32px);
        height: 520px;
        max-height: calc(100vh - 120px);
        background: rgba(15, 23, 42, 0.96);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(139, 92, 246, 0.35);
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        z-index: 9999;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 20px;
        overflow: hidden;
        animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .school-ai-header {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .school-ai-title {
        color: #ffffff;
        font-weight: 700;
        font-size: 1.05rem;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    /* Role Quick Selector Pills */
    .role-selector-bar {
        width: 100%;
        display: flex;
        gap: 8px;
        justify-content: center;
        margin-top: 10px;
    }
    .role-pill-btn {
        background: rgba(30, 41, 59, 0.8);
        border: 1px solid rgba(139, 92, 246, 0.3);
        color: #cbd5e1;
        font-size: 0.78rem;
        font-weight: 600;
        padding: 6px 12px;
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.25s ease;
    }
    .role-pill-btn.active, .role-pill-btn:hover {
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: #ffffff;
        border-color: transparent;
        box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
    }

    /* Central Voice Orb */
    .voice-orb-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        margin: auto 0;
    }
    .voice-orb-btn {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        border: none;
        color: #ffffff;
        font-size: 2.5rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 30px rgba(139, 92, 246, 0.5);
        transition: all 0.3s ease;
    }
    .voice-orb-btn.listening {
        background: linear-gradient(135deg, #ef4444, #dc2626) !important;
        box-shadow: 0 0 45px rgba(239, 68, 68, 0.8) !important;
        animation: orbPulse 1.2s infinite;
    }
    .voice-orb-btn.speaking {
        background: linear-gradient(135deg, #10b981, #059669) !important;
        box-shadow: 0 0 45px rgba(16, 185, 129, 0.8) !important;
        animation: orbPulse 1.5s infinite;
    }
    @keyframes orbPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
    }

    .voice-status-text {
        font-size: 1.05rem;
        font-weight: 700;
        color: #e2e8f0;
        text-align: center;
    }

    /* Live Subtitle Transcript Display */
    .voice-subtitle-box {
        width: 100%;
        background: rgba(30, 41, 59, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 14px 16px;
        color: #cbd5e1;
        font-size: 0.88rem;
        line-height: 1.4;
        text-align: center;
        min-height: 75px;
        max-height: 110px;
        overflow-y: auto;
    }
</style>

<button class="school-ai-floating-btn" onclick="toggleSchoolAiModal()">
    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
    <span>Connect AI Voice</span>
</button>

<div class="school-ai-modal" id="schoolAiModal">
    <div class="school-ai-header">
        <div class="school-ai-title">
            <svg width="20" height="20" fill="none" stroke="#c084fc" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
            Campus-Connect AI Voice
        </div>
        <button onclick="toggleSchoolAiModal()" style="background: none; border: none; color: #94a3b8; font-size: 1.3rem; cursor: pointer;">&times;</button>
    </div>

    <!-- Role Selection Bar -->
    <div class="role-selector-bar">
        <button class="role-pill-btn" id="roleBtnParent" onclick="setAiRole('parent')">👨‍👩‍👧 Parent</button>
        <button class="role-pill-btn" id="roleBtnTeacher" onclick="setAiRole('teacher')">👨‍🏫 Teacher/Staff</button>
        <button class="role-pill-btn" id="roleBtnPublic" onclick="setAiRole('public')">🌐 Visitor (Public)</button>
    </div>

    <!-- Single Central Voice Microphone -->
    <div class="voice-orb-container">
        <button class="voice-orb-btn" id="singleVoiceOrbBtn" onclick="toggleVoiceAgent()">
            <i class="fa-solid fa-microphone" id="orbIcon"></i>
        </button>
        <div class="voice-status-text" id="voiceAgentStatus">Tap to Start Listening</div>
    </div>

    <!-- Live Subtitle Display -->
    <div class="voice-subtitle-box" id="voiceSubtitleBox">
        Hello! Welcome to Campus-Connect AI Voice. Who am I talking to today? Tap a role or tap the mic to speak.
    </div>
</div>

<script>
    let schoolAiContext = { user_role: 'public' };
    let isListening = false;
    let isSpeaking = false;
    let recognition = null;
    let currentSpeechText = '';

    function toggleSchoolAiModal() {
        const modal = document.getElementById('schoolAiModal');
        modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
        if (modal.style.display === 'none') {
            stopVoiceAgent();
        }
    }

    function setAiRole(role) {
        schoolAiContext.user_role = role;
        document.querySelectorAll('.role-pill-btn').forEach(btn => btn.classList.remove('active'));

        const subtitle = document.getElementById('voiceSubtitleBox');

        if (role === 'parent') {
            document.getElementById('roleBtnParent').classList.add('active');
            const msg = "Role: Parent. Please tell me your student's full name and registered phone number to verify.";
            subtitle.innerText = msg;
            speakAiResponse(msg);
        } else if (role === 'teacher') {
            document.getElementById('roleBtnTeacher').classList.add('active');
            const msg = "Role: Teacher/Staff. Please ensure you are logged in to access and update your assigned class records.";
            subtitle.innerText = msg;
            speakAiResponse(msg);
        } else {
            document.getElementById('roleBtnPublic').classList.add('active');
            const msg = "Role: Visitor. How can I help you with school admissions or campus information today?";
            subtitle.innerText = msg;
            speakAiResponse(msg);
        }
    }

    function stopSpeechSynthesis() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
        }
        isSpeaking = false;
    }

    function updateVoiceState(state, text) {
        const btn = document.getElementById('singleVoiceOrbBtn');
        const icon = document.getElementById('orbIcon');
        const status = document.getElementById('voiceAgentStatus');
        const subtitle = document.getElementById('voiceSubtitleBox');

        btn.classList.remove('listening', 'speaking');

        if (state === 'listening') {
            btn.classList.add('listening');
            icon.className = "fa-solid fa-square";
            status.innerText = "Listening... Tap to Stop & Submit";
            status.style.color = "#f87171";
            if (text) subtitle.innerText = text;
        } else if (state === 'speaking') {
            btn.classList.add('speaking');
            icon.className = "fa-solid fa-volume-high";
            status.innerText = "AI Speaking...";
            status.style.color = "#34d399";
            if (text) subtitle.innerText = text;
        } else {
            icon.className = "fa-solid fa-microphone";
            status.innerText = "Tap to Start Listening";
            status.style.color = "#e2e8f0";
            if (text) subtitle.innerText = text;
        }
    }

    function startVoiceListening() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            alert("Speech recognition is not supported in your browser.");
            return;
        }

        stopSpeechSynthesis();
        currentSpeechText = '';

        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRec();
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onstart = function() {
            isListening = true;
            updateVoiceState('listening', "Listening to your voice... Tap button when finished.");
        };

        recognition.onresult = function(event) {
            let interim = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    currentSpeechText += event.results[i][0].transcript + ' ';
                } else {
                    interim += event.results[i][0].transcript;
                }
            }
            const displayText = (currentSpeechText + interim).trim();
            if (displayText) {
                document.getElementById('voiceSubtitleBox').innerText = "You: " + displayText;
            }
        };

        recognition.onerror = function(err) {
            console.warn("Speech recognition error:", err);
            isListening = false;
            updateVoiceState('idle', "Could not hear clearly. Tap mic to try again.");
        };

        recognition.onend = function() {
            isListening = false;
            if (!isSpeaking && currentSpeechText.trim()) {
                submitVoiceTranscript(currentSpeechText.trim());
            } else if (!isSpeaking) {
                updateVoiceState('idle');
            }
        };

        recognition.start();
    }

    function stopVoiceAgent() {
        if (isListening && recognition) {
            try { recognition.stop(); } catch(e) {}
            isListening = false;
        } else {
            stopSpeechSynthesis();
            updateVoiceState('idle');
        }
    }

    function toggleVoiceAgent() {
        if (isListening) {
            stopVoiceAgent();
        } else if (isSpeaking) {
            stopSpeechSynthesis();
            updateVoiceState('idle');
        } else {
            startVoiceListening();
        }
    }

    async function submitVoiceTranscript(transcript) {
        updateVoiceState('speaking', "AI is processing your request...");

        try {
            const res = await fetch('/api/v1/schoolai/chat/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: transcript, session_context: schoolAiContext })
            });

            const data = await res.json();
            const replyText = data.success ? data.reply : (data.reply || "I couldn't process that. Please try again.");
            
            if (data.session_context) {
                schoolAiContext = data.session_context;
            }

            speakAiResponse(replyText);
        } catch (e) {
            updateVoiceState('idle', "Connection error. Please tap mic to try again.");
        }
    }

    function speakAiResponse(text) {
        if (!('speechSynthesis' in window)) {
            updateVoiceState('idle', text);
            return;
        }

        stopSpeechSynthesis();

        const cleanText = text.replace(/<[^>]*>?/gm, '');
        const utter = new SpeechSynthesisUtterance(cleanText);

        isSpeaking = true;
        updateVoiceState('speaking', "AI: " + cleanText);

        utter.onend = function() {
            isSpeaking = false;
            updateVoiceState('idle', "AI: " + cleanText);
        };
        utter.onerror = function() {
            isSpeaking = false;
            updateVoiceState('idle', "AI: " + cleanText);
        };

        window.speechSynthesis.speak(utter);
    }
</script>
