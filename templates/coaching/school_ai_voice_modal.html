<!-- SchoolAiVoice Floating Assistant Widget -->
<style>
    .school-ai-floating-btn {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 9990;
        background: linear-gradient(135deg, #6366f1, #8b5cf6, #d946ef);
        background-size: 200% 200%;
        animation: pulseGlow 4s infinite alternate;
        color: #ffffff;
        border: none;
        border-radius: 50px;
        padding: 14px 22px;
        font-weight: 600;
        font-size: 0.95rem;
        box-shadow: 0 10px 25px rgba(139, 92, 246, 0.45);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .school-ai-floating-btn:hover {
        transform: translateY(-3px) scale(1.03);
        box-shadow: 0 14px 30px rgba(139, 92, 246, 0.6);
    }
    @keyframes pulseGlow {
        0% { background-position: 0% 50%; }
        100% { background-position: 100% 50%; }
    }

    .school-ai-modal {
        display: none;
        position: fixed;
        bottom: 90px;
        right: 24px;
        width: 400px;
        max-width: calc(100vw - 32px);
        height: 560px;
        max-height: calc(100vh - 120px);
        background: rgba(15, 23, 42, 0.96);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(139, 92, 246, 0.35);
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        z-index: 9999;
        flex-direction: column;
        overflow: hidden;
        animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .school-ai-header {
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(139, 92, 246, 0.3));
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding: 14px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .school-ai-title {
        color: #ffffff;
        font-weight: 700;
        font-size: 1.05rem;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .voice-control-bar {
        background: rgba(30, 41, 59, 0.85);
        padding: 10px 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
    }
    .btn-voice-single {
        padding: 8px 18px;
        border-radius: 25px;
        font-size: 0.85rem;
        font-weight: 700;
        border: none;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: linear-gradient(135deg, #10b981, #059669);
        color: #ffffff;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        transition: all 0.25s ease;
    }
    .btn-voice-single.active {
        background: linear-gradient(135deg, #ef4444, #dc2626) !important;
        box-shadow: 0 0 18px rgba(239, 68, 68, 0.75) !important;
        animation: pulseVoice 1.2s infinite;
    }
    @keyframes pulseVoice {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
    }

    .school-ai-body {
        flex: 1;
        padding: 16px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .school-ai-msg {
        max-width: 85%;
        padding: 12px 16px;
        border-radius: 16px;
        font-size: 0.9rem;
        line-height: 1.45;
        word-wrap: break-word;
    }
    .school-ai-msg.bot {
        background: rgba(30, 41, 59, 0.9);
        color: #e2e8f0;
        border: 1px solid rgba(255, 255, 255, 0.08);
        align-self: flex-start;
        border-bottom-left-radius: 4px;
    }
    .school-ai-msg.user {
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: #ffffff;
        align-self: flex-end;
        border-bottom-right-radius: 4px;
    }

    .school-ai-footer {
        padding: 12px;
        background: rgba(15, 23, 42, 0.95);
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        gap: 8px;
        align-items: center;
    }
    .school-ai-input {
        flex: 1;
        background: rgba(30, 41, 59, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 25px;
        padding: 10px 16px;
        color: #ffffff;
        font-size: 0.9rem;
        outline: none;
    }
    .school-ai-btn-mic {
        background: rgba(139, 92, 246, 0.2);
        border: 1px solid rgba(139, 92, 246, 0.4);
        color: #c084fc;
        border-radius: 50%;
        width: 42px;
        height: 42px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.25s ease;
    }
    .school-ai-btn-mic.recording {
        background: #ef4444 !important;
        color: #ffffff !important;
        border-color: #f87171 !important;
        box-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
    }
</style>

<button class="school-ai-floating-btn" onclick="toggleSchoolAiModal()">
    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
    <span>Connect AI Voice</span>
</button>

<div class="school-ai-modal" id="schoolAiModal">
    <div class="school-ai-header">
        <div class="school-ai-title">
            <svg width="20" height="20" fill="none" stroke="#c084fc" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
            Campus-Connect AI Voice
        </div>
        <button onclick="toggleSchoolAiModal()" style="background: none; border: none; color: #94a3b8; font-size: 1.3rem; cursor: pointer;">&times;</button>
    </div>

    <!-- Voice Single Toggle Control Bar -->
    <div class="voice-control-bar">
        <span id="aiVoiceStatusLabel" style="font-size: 0.82rem; color: #94a3b8; font-weight: 600;">Voice Status: Idle</span>
        <button class="btn-voice-single" id="singleVoiceBtn" onclick="toggleSchoolAiSpeech()">
            <i class="fa-solid fa-microphone"></i> <span id="voiceBtnText">Start Listening</span>
        </button>
    </div>

    <div class="school-ai-body" id="schoolAiBody">
        <div class="school-ai-msg bot">
            Hello! I am your Campus-Connect AI Assistant. How can I help you today? Ask about student attendance, marks, fees, or ask <b>"Who created you?"</b>.
        </div>
    </div>

    <div class="school-ai-footer">
        <button class="school-ai-btn-mic" id="schoolAiMicBtn" onclick="toggleSchoolAiSpeech()" title="Toggle Voice Input">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
        </button>
        <input type="text" class="school-ai-input" id="schoolAiInput" placeholder="Type or speak a question..." onkeypress="if(event.key==='Enter') sendSchoolAiMsg()">
        <button onclick="sendSchoolAiMsg()" style="background: #8b5cf6; border: none; color: white; border-radius: 50%; width: 42px; height: 42px; cursor: pointer; display: flex; align-items: center; justify-content: center;">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </button>
    </div>
</div>

<script>
    let schoolAiContext = {};
    let isRecording = false;
    let recognition = null;
    let isBotSpeaking = false;

    function toggleSchoolAiModal() {
        const modal = document.getElementById('schoolAiModal');
        modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
    }

    function stopAiSpeechSynthesis() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
        }
        isBotSpeaking = false;
    }

    function appendSchoolAiMsg(sender, text) {
        const body = document.getElementById('schoolAiBody');
        const msgDiv = document.createElement('div');
        msgDiv.className = `school-ai-msg ${sender}`;
        msgDiv.innerHTML = text;
        body.appendChild(msgDiv);
        body.scrollTop = body.scrollHeight;

        if (sender === 'bot' && 'speechSynthesis' in window) {
            stopAiSpeechSynthesis();
            const cleanText = text.replace(/<[^>]*>?/gm, '');
            const utter = new SpeechSynthesisUtterance(cleanText);
            
            // Pause recognition while speaking so AI does not listen to itself
            if (recognition && isRecording) {
                try { recognition.stop(); } catch(e) {}
            }

            isBotSpeaking = true;
            utter.onend = function() {
                isBotSpeaking = false;
                if (isRecording && recognition) {
                    try { recognition.start(); } catch(e) {}
                }
            };
            utter.onerror = function() {
                isBotSpeaking = false;
            };

            window.speechSynthesis.speak(utter);
        }
    }

    async function sendSchoolAiMsg() {
        const input = document.getElementById('schoolAiInput');
        const msg = input.value.trim();
        if (!msg) return;

        // User interruption: Cancel AI voice playback when user sends a new message
        stopAiSpeechSynthesis();

        appendSchoolAiMsg('user', msg);
        input.value = '';

        try {
            const res = await fetch('/api/v1/schoolai/chat/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: msg, session_context: schoolAiContext })
            });

            const data = await res.json();
            if (data.success) {
                schoolAiContext = data.session_context || schoolAiContext;
                appendSchoolAiMsg('bot', data.reply);
            } else {
                appendSchoolAiMsg('bot', data.reply || "I couldn't process that right now. Please try again.");
            }
        } catch (e) {
            appendSchoolAiMsg('bot', "Connection error. Please try again in a moment.");
        }
    }

    function startAiVoiceListening() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            alert("Speech recognition is not supported in your browser. Please type your message.");
            return;
        }

        stopAiSpeechSynthesis();

        const singleBtn = document.getElementById('singleVoiceBtn');
        const btnText = document.getElementById('voiceBtnText');
        const micBtn = document.getElementById('schoolAiMicBtn');
        const statusLbl = document.getElementById('aiVoiceStatusLabel');

        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRec();
        recognition.continuous = true;
        recognition.interimResults = false;

        recognition.onstart = function() {
            isRecording = true;
            stopAiSpeechSynthesis();
            singleBtn.classList.add('active');
            btnText.innerText = "Stop Listening";
            micBtn.classList.add('recording');
            statusLbl.innerText = "Status: Listening...";
            statusLbl.style.color = "#34d399";
        };

        recognition.onspeechstart = function() {
            stopAiSpeechSynthesis(); // User interruption handling
        };

        recognition.onresult = function(event) {
            if (isBotSpeaking) return; // Prevent AI self-interruption
            stopAiSpeechSynthesis();
            const lastResultIndex = event.results.length - 1;
            const transcript = event.results[lastResultIndex][0].transcript;
            document.getElementById('schoolAiInput').value = transcript;
            sendSchoolAiMsg();
        };

        recognition.onerror = function(err) {
            console.warn("Speech recognition error:", err);
            statusLbl.innerText = "Status: Idle";
            statusLbl.style.color = "#94a3b8";
        };

        recognition.onend = function() {
            if (isRecording && !isBotSpeaking) {
                try { recognition.start(); } catch(e) {}
            } else if (!isRecording) {
                singleBtn.classList.remove('active');
                btnText.innerText = "Start Listening";
                micBtn.classList.remove('recording');
                statusLbl.innerText = "Status: Idle";
                statusLbl.style.color = "#94a3b8";
            }
        };

        recognition.start();
    }

    function stopAiVoiceListening() {
        isRecording = false;
        if (recognition) recognition.stop();
        stopAiSpeechSynthesis();
        const singleBtn = document.getElementById('singleVoiceBtn');
        const btnText = document.getElementById('voiceBtnText');
        const micBtn = document.getElementById('schoolAiMicBtn');
        const statusLbl = document.getElementById('aiVoiceStatusLabel');

        singleBtn.classList.remove('active');
        btnText.innerText = "Start Listening";
        micBtn.classList.remove('recording');
        statusLbl.innerText = "Status: Idle";
        statusLbl.style.color = "#94a3b8";
    }

    function toggleSchoolAiSpeech() {
        if (isRecording) {
            stopAiVoiceListening();
        } else {
            startAiVoiceListening();
        }
    }
</script>
